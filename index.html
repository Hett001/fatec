<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizzaria chad</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://use.typekit.net/uom8kmp.css">
</head>
<body>
    <header>
        <h1 style="font-family: rosewood-std-sandbox"> Pizzaria do CJ </h1>
    </header>
    <main>
        <section>
    <table>
        <caption style="font-family: rosewood-std-sandbox"> Cardápio de Pizza</caption>
        <colgroup>
            <col class="sabores">
        </colgroup>
        <thead>
            <tr>
            <th colspan="4"> Cardápio de Pizzas em Promoção </th>
            </tr>
    <tr>
        <th> Sabor </th>
        <th> Descrição </th>
        <th> Preço </th>
        <th> Observação </th>
    </tr>
        </thead>
        <tbody>
    <tr>
        <td> Calabresa </td>
        <td> calabresa, tomate, cebola </td>
        <td> R$50 </td>
        <td> Muita cebola </td>
    </tr>
    <tr>
        <td> Portuguesa </td>
        <td> palmito, milho, ervilha </td>
        <td> R$60 </td>
        <td> palmito grande </td>
    </tr>
    <tr>
        <td> Marguertia </td>
        <td> Queijo, tomate </td>
        <td> R$55 </td>
        <td> muito queijo </td>
    </tr>
    </tbody>
    <tfoot>
        <tr>
            <th rowspan="2" colspan="2"> Final de Semana</th>
            <td colspan="2"> 10% Sábado</td>
        </tr>
        <tr>
            <td colspan="2"> 20% Domingo</td>
        </tr>
    </tfoot>
    </table>
        </section>
    </main>
</body>
</html>
